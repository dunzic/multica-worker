global
    maxconn 512

defaults
    mode tcp
    timeout connect 3s
    timeout client 30s
    timeout server 30s

frontend postgres
    bind *:5432
    default_backend postgres_nodes

backend postgres_nodes
    option pgsql-check user multica
    server primary rs07-pg-primary:5432 check inter 500ms fall 2 rise 1
    server standby rs07-pg-standby:5432 check backup inter 500ms fall 2 rise 1
