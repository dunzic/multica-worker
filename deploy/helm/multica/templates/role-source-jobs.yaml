{{- $backendImageTag := default .Chart.AppVersion .Values.images.backend.tag -}}
{{- if .Values.roleSource.capacityEvidence.enabled }}
{{- $capacityClaim := required "roleSource.capacityEvidence.existingClaim is required when capacity evidence is enabled" .Values.roleSource.capacityEvidence.existingClaim -}}
{{- $capacityWorkspace := required "roleSource.capacityEvidence.workspaceId is required when capacity evidence is enabled" .Values.roleSource.capacityEvidence.workspaceId -}}
{{- $capacityRuntime := required "roleSource.capacityEvidence.runtimeId is required when capacity evidence is enabled" .Values.roleSource.capacityEvidence.runtimeId -}}
{{- $capacityRun := required "roleSource.capacityEvidence.runName is required when capacity evidence is enabled" .Values.roleSource.capacityEvidence.runName -}}
{{- $capacityReport := required "roleSource.capacityEvidence.reportFile is required when capacity evidence is enabled" .Values.roleSource.capacityEvidence.reportFile -}}
{{- if not (regexMatch `^[a-z0-9]([-a-z0-9]{0,38}[a-z0-9])?$` $capacityRun) -}}
{{- fail "roleSource.capacityEvidence.runName must be a lowercase DNS-safe slug up to 40 characters" -}}
{{- end -}}
{{- if not (regexMatch `^[a-z0-9][a-z0-9.-]{0,126}[a-z0-9]$` $capacityReport) -}}
{{- fail "roleSource.capacityEvidence.reportFile must be a safe basename" -}}
{{- end -}}
{{- if or (lt (int .Values.roleSource.capacityEvidence.minimumWorkspaceMembers) 1) (lt (int .Values.roleSource.capacityEvidence.minimumWorkspaceRuntimes) 1) (lt (int .Values.roleSource.capacityEvidence.minimumWorkspaceSources) 1) (lt (int .Values.roleSource.capacityEvidence.minimumAttestationHistory) 1) -}}
{{- fail "roleSource.capacityEvidence requires non-zero approved workspace and history minima" -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-role-source-capacity-%s-%s" (include "multica.backend.fullname" . | trunc 20 | trimSuffix "-") ($capacityRun | trunc 20 | trimSuffix "-") ($capacityRun | sha256sum | trunc 8) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "multica.labels" . | nindent 4 }}
    app.kubernetes.io/component: role-source-capacity
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.roleSource.capacityEvidence.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "multica.labels" . | nindent 8 }}
        app.kubernetes.io/component: role-source-capacity
    spec:
      restartPolicy: Never
      {{- with .Values.roleSource.jobs.serviceAccountName }}
      serviceAccountName: {{ . | quote }}
      {{- end }}
      containers:
        - name: capacity
          image: "{{ .Values.images.backend.repository }}:{{ $backendImageTag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: ["./role_source_capacity"]
          env:
            - name: PGOPTIONS
              value: "-c default_transaction_read_only=on -c statement_timeout=5000"
            {{- if not .Values.postgres.external.enabled }}
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: {{ include "multica.databaseUrl" . | quote }}
            {{- else }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DATABASE_URL
            {{- end }}
          args:
            - --workspace-id
            - {{ $capacityWorkspace | quote }}
            - --runtime-id
            - {{ $capacityRuntime | quote }}
            - --samples
            - {{ .Values.roleSource.capacityEvidence.samples | quote }}
            - --concurrency
            - {{ .Values.roleSource.capacityEvidence.concurrency | quote }}
            - --minimum-users
            - {{ .Values.roleSource.capacityEvidence.minimumUsers | quote }}
            - --minimum-workspace-members
            - {{ .Values.roleSource.capacityEvidence.minimumWorkspaceMembers | quote }}
            - --minimum-workspace-runtimes
            - {{ .Values.roleSource.capacityEvidence.minimumWorkspaceRuntimes | quote }}
            - --minimum-workspace-sources
            - {{ .Values.roleSource.capacityEvidence.minimumWorkspaceSources | quote }}
            - --minimum-attestation-history
            - {{ .Values.roleSource.capacityEvidence.minimumAttestationHistory | quote }}
            - --report
            - {{ printf "/evidence/%s" $capacityReport | quote }}
          volumeMounts:
            - name: evidence
              mountPath: /evidence
          resources:
            {{- toYaml .Values.roleSource.capacityEvidence.resources | nindent 12 }}
      {{- with .Values.roleSource.jobs.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.roleSource.jobs.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: evidence
          persistentVolumeClaim:
            claimName: {{ $capacityClaim | quote }}
{{- end }}
{{- if and .Values.roleSource.capacityEvidence.enabled .Values.roleSource.disasterRecovery.backup.enabled }}
---
{{- end }}
{{- if .Values.roleSource.disasterRecovery.backup.enabled }}
{{- $backup := .Values.roleSource.disasterRecovery.backup -}}
{{- $backupClaim := required "roleSource.disasterRecovery.backup.existingClaim is required when DR backup is enabled" $backup.existingClaim -}}
{{- $backupDirectory := required "roleSource.disasterRecovery.backup.outputDirectory is required when DR backup is enabled" $backup.outputDirectory -}}
{{- $backupRun := required "roleSource.disasterRecovery.backup.runName is required when DR backup is enabled" $backup.runName -}}
{{- $signingSecret := required "roleSource.disasterRecovery.backup.signingSecretName is required when DR backup is enabled" $backup.signingSecretName -}}
{{- if not (regexMatch `^[a-z0-9]([-a-z0-9]{0,38}[a-z0-9])?$` $backupRun) -}}
{{- fail "roleSource.disasterRecovery.backup.runName must be a lowercase DNS-safe slug up to 40 characters" -}}
{{- end -}}
{{- if not (regexMatch `^[a-z0-9]([-a-z0-9]{0,62}[a-z0-9])?$` $backupDirectory) -}}
{{- fail "roleSource.disasterRecovery.backup.outputDirectory must be a safe single directory name" -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-role-source-backup-%s-%s" (include "multica.backend.fullname" . | trunc 20 | trimSuffix "-") ($backupRun | trunc 20 | trimSuffix "-") ($backupRun | sha256sum | trunc 8) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "multica.labels" . | nindent 4 }}
    app.kubernetes.io/component: role-source-backup
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ $backup.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "multica.labels" . | nindent 8 }}
        app.kubernetes.io/component: role-source-backup
    spec:
      restartPolicy: Never
      {{- with .Values.roleSource.jobs.serviceAccountName }}
      serviceAccountName: {{ . | quote }}
      {{- end }}
      containers:
        - name: backup
          image: "{{ .Values.images.backend.repository }}:{{ $backendImageTag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: ["./role_source_dr"]
          args: ["backup", "--output-dir", {{ printf "/backup/%s" $backupDirectory | quote }}]
          env:
            - name: MULTICA_ROLE_SOURCE_DR_SIGNING_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $signingSecret | quote }}
                  key: MULTICA_ROLE_SOURCE_DR_SIGNING_KEY_ID
            - name: MULTICA_ROLE_SOURCE_DR_SIGNING_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $signingSecret | quote }}
                  key: MULTICA_ROLE_SOURCE_DR_SIGNING_PRIVATE_KEY
            {{- if not .Values.postgres.external.enabled }}
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: {{ include "multica.databaseUrl" . | quote }}
            {{- else }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: DATABASE_URL
            {{- end }}
            {{- if .Values.backend.uploads.persistence.enabled }}
            - name: LOCAL_UPLOAD_DIR
              value: /app/data/uploads
            {{- end }}
          {{- with $backup.storageSecretName }}
          envFrom:
            - secretRef:
                name: {{ . | quote }}
          {{- end }}
          volumeMounts:
            - name: backup
              mountPath: /backup
            {{- if .Values.backend.uploads.persistence.enabled }}
            - name: uploads
              mountPath: /app/data/uploads
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml $backup.resources | nindent 12 }}
      {{- with .Values.roleSource.jobs.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.roleSource.jobs.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: backup
          persistentVolumeClaim:
            claimName: {{ $backupClaim | quote }}
        {{- if .Values.backend.uploads.persistence.enabled }}
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ include "multica.backend.fullname" . }}-uploads
        {{- end }}
{{- end }}
