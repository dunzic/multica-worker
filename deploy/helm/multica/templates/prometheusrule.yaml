{{- if .Values.monitoring.prometheusRule.enabled }}
{{- $samplerQueryNames := "active_users|active_workspaces|task_queued|task_running|task_stuck|runtime_online|runtime_heartbeat_age|workspace_total" -}}
{{- $samplerErrorNames := printf "acquire|%s" $samplerQueryNames -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "multica.backend.fullname" . }}-sampler
  labels:
    {{- include "multica.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
    {{- with .Values.monitoring.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: multica-business-sampler
      rules:
        - alert: MulticaBusinessSamplerQueryErrors
          expr: |
            sum by (name) (
              rate(multica_business_sampler_query_errors_total{name=~"{{ $samplerErrorNames }}"}[10m])
            ) > 0
          for: {{ .Values.monitoring.prometheusRule.samplerQueryErrorsFor | quote }}
          labels:
            severity: {{ .Values.monitoring.prometheusRule.severity | quote }}
          annotations:
            summary: "Business sampler query errors"
            description: "Business sampler query {{ "{{ $labels.name }}" }} is returning errors. Metrics may go stale if the query keeps timing out."
        - alert: MulticaBusinessSamplerQueryLatencyHigh
          expr: |
            histogram_quantile(
              0.95,
              sum by (le, name) (
                rate(multica_business_sampler_query_seconds_bucket{name=~"{{ $samplerQueryNames }}"}[10m])
              )
            ) > 0.3
          for: {{ .Values.monitoring.prometheusRule.samplerQueryLatencyFor | quote }}
          labels:
            severity: {{ .Values.monitoring.prometheusRule.severity | quote }}
          annotations:
            summary: "Business sampler query p95 is high"
            description: "Business sampler query {{ "{{ $labels.name }}" }} p95 is above 300ms, leaving little headroom before the 500ms statement_timeout."
    - name: multica-role-source
      rules:
        - alert: MulticaRoleSourceApplyFailureAuditWriteFailed
          expr: |
            sum by (outcome) (
              increase(multica_role_source_apply_failure_audit_writes_total{outcome=~"persist_failed|id_generation_failed"}[5m])
            ) > 0
          for: {{ .Values.monitoring.prometheusRule.roleSourceAuditWriteFailureFor | quote }}
          labels:
            severity: {{ .Values.monitoring.prometheusRule.roleSourceSeverity | quote }}
          annotations:
            summary: "Role-source apply failure evidence could not be persisted"
            description: "At least one apply request returned an error, but its independent failure-audit row could not be written (outcome={{ "{{ $labels.outcome }}" }}). Preserve server logs, stop role-source apply rollout, and reconcile successful receipts before retry or recovery."
        - alert: MulticaRoleSourceApplyCommitReconciliationFailed
          expr: |
            sum by (outcome) (
              increase(multica_role_source_apply_commit_reconciliations_total{outcome=~"query_failed|conflict"}[5m])
            ) > 0
          for: {{ .Values.monitoring.prometheusRule.roleSourceCommitReconciliationFailureFor | quote }}
          labels:
            severity: {{ .Values.monitoring.prometheusRule.roleSourceSeverity | quote }}
          annotations:
            summary: "Role-source apply commit outcome could not be reconciled"
            description: "An apply COMMIT returned an error and the independent receipt check could not safely establish the outcome (outcome={{ "{{ $labels.outcome }}" }}). Stop apply rollout and reconcile the request against successful receipts before retry or recovery."
        - alert: MulticaRoleSourceArtifactGCDeleteFailures
          expr: increase(multica_role_source_artifact_gc_delete_failures_total[15m]) > 20
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Role-source artifact garbage collection cannot permanently purge objects"
            description: "More than 20 role-source artifact purges failed in 15 minutes and the failure rate stayed elevated. The durable intents are retained for retry; inspect object-storage availability, version-list/version-delete permissions, Object Lock/legal hold and backend purge support before backlog growth exhausts capacity."
        - alert: MulticaRoleSourceRuntimeAttestationPersistenceFailed
          expr: increase(multica_role_source_runtime_config_attestations_total{outcome="persist_failed"}[5m]) > 0
          for: {{ .Values.monitoring.prometheusRule.roleSourceAuditWriteFailureFor | quote }}
          labels:
            severity: {{ .Values.monitoring.prometheusRule.roleSourceSeverity | quote }}
          annotations:
            summary: "Role-source runtime loaded-configuration evidence could not be persisted"
            description: "A daemon supplied a valid loaded-configuration attestation but the server could not durably record it. The daemon will retry because no acknowledgement was returned; inspect PostgreSQL availability and migration state before enabling role-source scans."
{{- end }}
